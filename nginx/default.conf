# CyberIsland: the only thing students talk to.
#   /            the built game (static files)
#   /api/        reverse proxy to the backend container
#   /admin       admin page (proxied to the backend), see admin-access.conf for who may reach it
#
# Mounted read-only into the web container by docker-compose.yml. After editing:  docker compose restart web

# Per-client-IP rate limits. They are generous on purpose: a whole lab or Wi-Fi network may share one NAT address.
# Every zone is keyed by the CLIENT IP, so an address that floods the admin page is throttled on its own and cannot
# lock other admins/students out (there is deliberately no global lockout).
limit_req_zone $binary_remote_addr zone=api:10m        rate=100r/s;  # everything under /api/
limit_req_zone $binary_remote_addr zone=teamlogin:10m  rate=30r/m;   # team login (a lab logging in together: raise this)
limit_req_zone $binary_remote_addr zone=admin:10m      rate=20r/s;   # admin page + admin API (the page polls ~1 request/s)
limit_req_zone $binary_remote_addr zone=adminlogin:1m  rate=5r/m;    # admin login: brute-force guard
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The backend accepts bodies up to 100 KB (a 500-team import is about 35 KB)
    client_max_body_size 128k;

    # The per-IP limits and the access log use the address nginx sees. Check `docker compose logs web` shows the real
    # client addresses and NOT the same Docker gateway address (172.x.x.1) for everybody: otherwise all students and the
    # admin would share one rate-limit bucket. If a college proxy / load balancer sits in front of this server, trust
    # its forwarded header (uncomment and set the proxy's address):
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS, so the backend container can be recreated without restarting nginx.
    # (proxy_pass uses a variable below: the name is re-resolved every few seconds instead of once at startup.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # ---- admin ----------------------------------------------------------------------------------------
    # Access rules live in admin-access.conf (open / IP allowlist / disabled). Login is rate limited and the
    # backend only allows one admin session at a time.
    # These are case-INsensitive (~*) on purpose: the backend (Express) routes /API/Admin/... to the same handlers,
    # so a case-sensitive match here would let that spelling bypass the access rules and the login rate limit.
    # Regex locations are tried in order, so the login rule must stay above the general admin rule.
    location ~* ^/api/admin/auth/login/?$ {
        include /etc/nginx/admin-access.conf;
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass $backend;
    }

    location ~* ^/api/admin(/|$) {
        include /etc/nginx/admin-access.conf;
        limit_req zone=admin burst=40 nodelay;
        proxy_pass $backend;
    }

    location ~* ^/admin(/|$) {
        include /etc/nginx/admin-access.conf;
        limit_req zone=admin burst=40 nodelay;
        proxy_pass $backend;
    }

    # ---- team API -------------------------------------------------------------------------------------
    location ~* ^/api/auth/login/?$ {
        limit_req zone=teamlogin burst=30 nodelay;
        proxy_pass $backend;
    }

    location /api/ {
        limit_req zone=api burst=200 nodelay;
        proxy_pass $backend;
    }

    # ---- static game ----------------------------------------------------------------------------------
    # Vite names bundles with a content hash (index-AbC123xy.js): safe to cache forever.
    # (The regex is quoted because it contains braces; unquoted, nginx reads {8,} as a block and refuses to start.)
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images / fonts keep their names, so cache them for a day only
    location ~* ^/(assets|fonts)/ {
        expires 1d;
    }

    # Always revalidate the entry page so a redeploy is picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
