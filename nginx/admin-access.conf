# Who may reach the admin page (/admin) and the admin API (/api/admin/*) through the public port.
# Included inside those nginx locations. After editing:  docker compose restart web
#
# The admin login (strong ADMIN_LOGIN_NAME / ADMIN_PASSWORD from .env, one session at a time, rate limited)
# protects it either way. Pick ONE of the three modes below.

# --- MODE 1 (current): open to anyone who can reach this server -------------------------------------------
# Nothing to add.

# --- MODE 2: only these addresses (ask IT for the admin machine's fixed IP or subnet) ---------------------
# allow 10.20.30.40;
# allow 192.168.1.0/24;
# deny all;

# --- MODE 3: not reachable through the public port at all -------------------------------------------------
# Use the SSH tunnel instead (see README.md, "Admin access").
# return 403;
