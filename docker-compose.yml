# CyberIsland: full deployment (database + backend + web). See README.md for the quickstart.
# (backend/docker-compose.yml is the developer-only variant: database + backend on :3000, no web container.)
#
# All settings come from a .env file next to this one (copy .env.example). Nothing else needs editing to deploy.
name: cyberisland

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: cyberisland
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyberisland"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No published ports: only the backend container can reach the database.

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-Asia/Kolkata}
      DATABASE_URL: postgresql://cyber:${DB_PASSWORD}@db:5432/cyberisland
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-30m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-6h}
      ADMIN_LOGIN_NAME: ${ADMIN_LOGIN_NAME:?set ADMIN_LOGIN_NAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CONTEST_TIMEZONE: ${CONTEST_TIMEZONE:-Asia/Kolkata}
      CONTEST_DURATION_MINUTES: ${CONTEST_DURATION_MINUTES:-180}
      CONTEST_GRACE_SECONDS: ${CONTEST_GRACE_SECONDS:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Reachable only from this machine (127.0.0.1). Students never use this port; it exists so the admin page can be
    # opened through an SSH tunnel (README, "Admin access"). Delete this block if you do not want it.
    ports:
      - "127.0.0.1:${BACKEND_LOCAL_PORT:-3000}:3000"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/admin-access.conf:/etc/nginx/admin-access.conf:ro
    # The one port students use:  http://<server>:${WEB_PORT}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:80"

volumes:
  pgdata:
